[project]
name = "cross-section-tool"
version = "0.1.0"
description = "Cross-Section Tool MCP server: provenance-tiered, constraint-resolved 2D section views with SVG rendering (MCP Apps) and exact-arc DXF export."
requires-python = "==3.11.*"
dependencies = [
    # Versions verified against PyPI 2026-07-07 in the build session.
    "fastmcp==3.4.3",
    "ezdxf==1.4.4",
    "python-solvespace==3.0.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xsect"]

[project.scripts]
xsect-server = "xsect.server.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/xsect"]

[[tool.mypy.overrides]]
module = ["python_solvespace.*", "ezdxf.*", "fastmcp.*", "mcp.*"]
ignore_missing_imports = true
